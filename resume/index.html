<style>
  :root{
    --bg: #F2F7F5;
    --surface: #FFFFFF;
    --line: #D7E6DF;
    --text: #0D2B20;
    --muted: #52695E;
    --copper: #006747;
    --copper-deep: #00402C;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --display: 'Space Grotesk', var(--sans);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; flex-wrap:wrap; align-items:center; gap:1rem;
    padding:1rem 1.25rem; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--display); font-weight:700; font-size:1.1rem; text-decoration:none; color:var(--text);}
  .brand span{color:var(--copper);}
  .title{font-family:var(--display); font-weight:600; color:var(--muted); font-size:.95rem;}
  .spacer{flex:1 1 auto;}
  .btn{
    display:inline-block; padding:.5rem .95rem; border-radius:999px; text-decoration:none;
    font-weight:600; font-size:.9rem; border:1px solid var(--copper); color:var(--copper);
  }
  .btn.solid{background:var(--copper); color:#fff;}
  .btn:hover{background:var(--copper-deep); border-color:var(--copper-deep); color:#fff;}
  main{flex:1 1 auto; padding:1rem; display:flex;}
  .frame{
    flex:1 1 auto; min-height:70vh; width:100%; border:1px solid var(--line);
    border-radius:10px; background:var(--surface); overflow:hidden;
  }
  .frame iframe, .frame object{width:100%; height:100%; min-height:70vh; border:0; display:block;}
  .fallback{padding:2rem; text-align:center; color:var(--muted);}
  footer{padding:.85rem 1.25rem; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; background:var(--surface);}
  @media (max-width:575px){
    .title{display:none;}
    main{padding:.5rem;}
  }
</style>
